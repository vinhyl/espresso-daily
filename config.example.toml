# ============================================================================
# 意式浓缩日报 (Espresso Daily) — 配置文件示例
# 复制为 config.toml 后修改；不要提交含密钥的 config.toml（LLM key 走 .env）。
# ============================================================================

[site]
title = "ESPRESSO DAILY"
subtitle = "意式浓缩 · 每日资讯流"
# 网站描述（用于 meta / OG）
description = "每日汇集意式浓缩咖啡的萃取理论与实操资讯，由 LLM 动态打标签（水压、水温、研磨度、器具评测…），可按标签/日期自由筛选。"
# 构建输出目录（Cloudflare Pages 输出目录设为 public）
output_dir = "public"
content_dir = "content"
base_url = ""   # 部署到子路径时填，例如 https://example.com/espresso ；根域留空

# ----------------------------------------------------------------------------
# 前端展示开关
# ----------------------------------------------------------------------------
[ui]
# 是否展示标签功能（筛选 chips / 热门标签云 / 标签页）。
# 当前标签生成机制较粗糙、标签过多且无实际意义，先关闭；
# 待采集一段时间、明确标签必要性后再评估机制，改为 true 即恢复。
show_tags = false

# ----------------------------------------------------------------------------
# 标签策略：不使用固定三分类。由 LLM/规则在整理时为每条内容生成 2-5 个
# 开放、具体的主题标签（如 9-bar、水温、研磨度、布粉wdt、咖啡机、磨豆机、
# 新手、评测…）。构建期从全量内容汇总词频，前端动态渲染筛选 chips 与标签页。
# 因此本配置**不再需要** categories 定义；下面仅保留一个可选的种子标签建议，
# 供 LLM 参考，不影响流程（可删除）。
# ----------------------------------------------------------------------------
[tags]
# 仅作为 LLM 打标签时的候选词表提示，可自由增删
suggestions = [
  "9-bar", "水温", "研磨度", "布粉wdt", "填压", "预浸泡", "通道效应",
  "萃取率tds", "粉水比", "奶泡", "调参dialin", "咖啡机", "磨豆机",
  "粉碗", "秤", "新手", "进阶", "评测", "对比", "意式基础",
]

# ----------------------------------------------------------------------------
# LLM 整理配置（OpenAI 兼容接口，例如 DeepSeek / 通义 / GLM）
# ----------------------------------------------------------------------------
[llm]
enabled = false                      # true 时启用 LLM 评分/分类；false 时走规则回退
base_url = "https://api.deepseek.com/v1"
api_key_env = "ESPRESSO_LLM_API_KEY"
model = "deepseek-chat"
# 评分阈值：低于此分的内容不收录
min_score = 60
# 每日最多收录条数（防止爆量）
max_per_day = 30
temperature = 0.2
# 深度解读开关：true 时，仅 kind=deepdive 的内容会在「阶段二」注入知识库生成
# 「深度解读」区块（两阶段流程见 src/score.py 模块注释）；false 时所有内容
# 只产出正文（原文直出 / 翻译直出 / 中文摘要），不产出深度解读。
deepdive_enabled = true
# 每日总标题开关：在 llm.enabled 基础上额外控制。true 时 LLM 会为当天全部
# 已收录资讯生成一个「概括性总标题」（content/{date}-00.md），用作归档列表/
# 首页近期日报卡片的日报标题；未启用/生成失败时回退当日最高分条目标题。
headline_enabled = true
# 每日总标题长度阈值（软/硬两级）：
#   headline_soft_chars : 生成结果超过此字数 → 触发一次 LLM 压缩重试（保留核心信息）
#   headline_max_chars  : 压缩后仍超过此字数 → 丢弃并回退最高分条目标题
headline_soft_chars = 60
headline_max_chars = 100

# ----------------------------------------------------------------------------
# 信息源（详见 SOURCES.md）。type: rss | search | manual
#   rss    : 标准 RSS/Atom，也适用于「自托管 RSSHub」生成的 feed
#   search : 调用站点 JSON 搜索接口并归一化（parser: zhihu/bilibili/smzdm）
#   manual : 人工精选（new_day.py 脚手架写 Markdown），不自动抓取
# category_hint 仅作 LLM/回退的弱提示（mixed/theory/technique/product），
# 不再决定最终标签——最终标签由 LLM 动态生成。
# ----------------------------------------------------------------------------
[[sources]]
name = "Sprudge"
type = "rss"
url = "https://sprudge.com/feed"
category_hint = "mixed"
lang = "en"
enabled = true

[[sources]]
name = "Perfect Daily Grind"
type = "rss"
url = "https://perfectdailygrind.com/feed/"
category_hint = "mixed"
lang = "en"
enabled = true

[[sources]]
name = "Daily Coffee News"
type = "rss"
url = "https://dailycoffeenews.com/feed/"
category_hint = "mixed"
lang = "en"
enabled = true

[[sources]]
name = "Barista Hustle"
type = "rss"
url = "https://www.baristahustle.com/blog/feed/"
category_hint = "theory"
lang = "en"
enabled = false    # ⚠️ Cloudflare 防护，需 fetch 时带浏览器 UA / 代理，先关闭

[[sources]]
name = "Reddit r/espresso"
type = "rss"
url = "https://www.reddit.com/r/espresso/.rss"
category_hint = "mixed"
lang = "en"
enabled = true

# ---- 中文 / 非 RSS 源：通过「自托管 RSSHub」转成 RSS（推荐，最省心） ----
# 先 `docker run -d --name rsshub -p 1200:1200 diygod/rsshub`，再把下面 URL 的
# 127.0.0.1:1200 改成你的 RSSHub 地址即可。路由均为 RSSHub 官方路径。
[[sources]]
name = "知乎 · 意式浓缩"
type = "rss"
url = "http://127.0.0.1:1200/zhihu/search/%E6%84%8F%E5%BC%8F%E6%B5%93%E7%BC%A9"
category_hint = "mixed"
lang = "zh"
enabled = false    # 需先自托管 RSSHub；或改用下方 type=search 直连

[[sources]]
name = "B站 · 意式浓缩咖啡"
type = "rss"
url = "http://127.0.0.1:1200/bilibili/search/all/%E6%84%8F%E5%BC%8F%E6%B5%93%E7%BC%A9%E5%92%96%E5%95%A1"
category_hint = "mixed"
lang = "zh"
enabled = false

[[sources]]
name = "豆瓣 · 咖啡小组"
type = "rss"
url = "http://127.0.0.1:1200/douban/group/123456"   # 替换为目标小组 id
category_hint = "mixed"
lang = "zh"
enabled = false

# ---- 中文 / 非 RSS 源：直连搜索接口（无需 RSSHub，但不稳定需维护） ----
[[sources]]
name = "知乎搜索 · 意式浓缩"
type = "search"
parser = "zhihu"
url = "https://www.zhihu.com/api/v4/search_v3?t=general&q=%E6%84%8F%E5%BC%8F%E6%B5%93%E7%BC%A9&limit=20"
referer = "https://www.zhihu.com/"
category_hint = "mixed"
lang = "zh"
enabled = false    # 知乎反爬，建议优先 RSSHub

[[sources]]
name = "B站搜索 · 意式浓缩"
type = "search"
parser = "bilibili"
url = "https://api.bilibili.com/x/web-interface/search/all/v2?keyword=%E6%84%8F%E5%BC%8F%E6%B5%93%E7%BC%A9%E5%92%96%E5%95%A1&page=1"
referer = "https://www.bilibili.com/"
category_hint = "mixed"
lang = "zh"
enabled = false

[[sources]]
name = "什么值得买 · 咖啡"
type = "manual"
url = "https://post.smzdm.com/"
category_hint = "product"
lang = "zh"
enabled = false    # 以人工精选为主（或直接用 RSSHub 的 smzdm 路由）

# ----------------------------------------------------------------------------
# 抓取行为
# ----------------------------------------------------------------------------
[fetch]
# 每源间隔（秒），礼貌抓取
per_source_delay = 2.0
user_agent = "EspressoDaily/0.1 (+https://github.com/your-org/espresso-daily)"
# 回看窗口（天）：只处理最近 N 天发布的条目
lookback_days = 3

# ----------------------------------------------------------------------------
# 基础 / 常青知识库（私有，不参与建站）
# 每个主题一篇（knowledge/<slug>.md），是对多篇权威文章的综合，正文末尾用
# 「## 参考来源」列出全部源头。AI 在解读新闻时把本库作为背景上下文注入，
# 做多角度深度整理（详见 README / SOURCES）。
#   dir       : 知识库目录（相对项目根）
#   mode      : all=全量注入（小库最全面，默认）；recall=按标签/概念高召回
#   max_chars : 背景上下文字符预算，超过截断
# ----------------------------------------------------------------------------
[knowledge]
dir = "knowledge"
mode = "all"
max_chars = 8000
