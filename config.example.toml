# ----------------------------------------------------------------------------
# 抓取行为
# ----------------------------------------------------------------------------
[fetch]
# 每源间隔（秒），礼貌抓取
per_source_delay = 2.0
user_agent = "EspressoDaily/0.1 (+https://github.com/your-org/espresso-daily)"
# 回看窗口（天）：只处理最近 N 天发布的条目
lookback_days = 3
# 归档时区：海外 RSS 发布时间多为 UTC，按此时区截日，使「当天采集」归当天。
# 国内用户为主，建议 Asia/Shanghai（=GMT+8）。留空则回退机器本地时区。
# 注意：Windows 显式用时区名需先装 tzdata（pip install tzdata）；留空则无需。
timezone = "Asia/Shanghai"

# ---- 按需全文抓取（阶段二）----
# 全文是稀缺资源：只有 ① 源上标了 full_text = true ② 该条通过 LLM 初筛(accept)
# 两个条件同时满足，才会去抓原文正文。目的是避免基于截断 RSS 摘要虚构参数/细节，
# 同时不给源站带来全量抓取压力。
fulltext_enabled = true
fulltext_max_chars = 12000     # 正文截断上限（控制送进 LLM 的 token）
fulltext_timeout = 20          # 单篇超时（秒）
fulltext_delay = 1.0           # 每篇全文之间的间隔（秒），礼貌抓取
fulltext_max_per_run = 12      # 每次运行最多抓多少篇全文（成本闸门）

# ----------------------------------------------------------------------------
# 基础 / 常青知识库（私有，不参与建站）
# 每个主题一篇（knowledge/<slug>.md），是对多篇权威文章的综合，正文末尾用
# 「## 参考来源」列出全部源头。AI 在解读新闻时把本库作为背景上下文注入，
# 做多角度深度整理（详见 README / SOURCES）。
#   dir       : 知识库目录（相对项目根）
#   mode      : all=全量注入（小库最全面，默认）；recall=按标签/概念高召回
#   max_chars : 背景上下文字符预算，超过截断（静默截断，无报错！）
# 2026-08 扩充后整库约 23 篇 / 18K 字符；预算 24000 留约 30% headroom
# 覆盖学术雷达补丁的追加增长。库总量接近预算 80% 时评估切 recall。
# ----------------------------------------------------------------------------
[knowledge]
dir = "knowledge"
mode = "all"
max_chars = 24000

# ----------------------------------------------------------------------------
# 每周学术雷达（阶段三，type=academic）
# 仅供周级 CI（weekly.yml → `python -m src.academic`）使用，**不要开启 enabled**，
# 否则每日管线会把论文抓进 content/，污染每日站点流。weekly 模式会无视 enabled
# 直接消费所有 type=academic 的源。
#   academic_must    : 多个检索词，全部以 OpenAlex abstract_search 串联 → AND 约束
#   academic_exclude : 标题/摘要命中任一即丢弃（非意式主题）
#   academic_filters : 透传 OpenAlex filter 串（如 from_publication_date 限定年份）
# ----------------------------------------------------------------------------
[[sources]]
name = "Espresso Extraction (OpenAlex+Crossref)"
type = "academic"
category_hint = "research"
lang = "en"
enabled = false
academic_must = ["espresso", "extraction"]
academic_exclude = ["tea", "pourover", "pour over", "cold brew", "caffeine health", "decaf", "sensory", "consumer"]
academic_filters = "from_publication_date:2015-01-01"
max_per_source = 8
